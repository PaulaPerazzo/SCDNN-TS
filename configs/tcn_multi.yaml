phase: tunning

tracker:
  project_name: neural_networks_2026

data_loader:
  name: ptbxl

pre_processing:
  name: none

modeling:
  structure:
    name: tcn
    input_size: 12
    output_size: 5
    num_levels: 11
    hidden_size: 64
    kernel_size: 3
    dropout: 0.1
    T: 2
    mlp: true
  
  training:
    name: dnn
    criterion: cross_entropy_loss
    learning_rate: 1e-3
    num_epochs: 200
    es_patience: 10
    es_delta: 0.0001
    batch_size: 64
    clip: 1.0
    normalize: true
    class_weights: false
    scheduler:
      name: reduce_on_plateau
      factor: 0.5
      patience: 2
      min_lr: 1e-6

metrics:
  name: logistic_multi_classifier_metrics
